[project]
name = "orthopedics-product-agents-backend"
version = "0.1.0"
description = "Agentic retrieval backend for orthopedics product knowledge"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "neo4j>=5.24",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "langfuse>=2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "config", "retrieval", "ingestion", "memory", "evals", "observability"]

[tool.ruff]
line-length = 100
