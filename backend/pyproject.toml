[project]
name = "orthopedics-product-agents-backend"
version = "0.1.0"
description = "Agentic retrieval backend for orthopedics product knowledge"
requires-python = ">=3.11,<3.12"
# Every dependency here is pinned exactly, not a >= floor -- both
# `pip install -e ".[dev]"` (used by the Dockerfile, CI, and README's local
# dev instructions) and `uv sync` read these directly, and none of those
# three paths otherwise re-resolves against uv.lock. A loose floor meant a
# fresh install on any given day could silently pick up whatever's newest
# on PyPI that satisfies it -- these exact versions are what's actually in
# uv.lock and backend/.venv today (verified via `pip freeze` against the
# real venv, not guessed). Bump a version here only when explicitly asked;
# see agents.md/feedback memory on not upgrading dependencies unprompted.
dependencies = [
    "langgraph==1.2.11",
    "langchain-openai==1.6.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "fastapi==0.141.1",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "neo4j==6.3.0",
    "pdfplumber==0.11.10",
    "tiktoken==0.14.0",
    "alembic==1.19.1",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "langfuse==4.15.1",
    # Only langchain-core/langchain-openai were needed until now --
    # langfuse.langchain.CallbackHandler (backend/observability/langfuse_setup.py)
    # requires the full langchain meta-package at import time.
    "langchain==1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "fpdf2==2.8.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped: backend/retrieval/graph_client.py's get_graph_client() is a
# process-wide (@lru_cache) Neo4j driver singleton, matching production's one
# event loop for the app's whole lifetime -- the default per-test loop scope
# would tear it down and rebuild it between tests, breaking that cache.
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "auth", "config", "documents", "tags", "retrieval", "ingestion", "memory", "evals", "observability"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own recommended pattern is Depends(...)/Query(...) etc. as an
# argument default — not the mutable-default bug B008 usually flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Path", "fastapi.Form"]
