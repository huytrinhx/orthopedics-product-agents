name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orthopedics
          POSTGRES_PASSWORD: orthopedics-dev
          POSTGRES_DB: orthopedics_agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orthopedics -d orthopedics_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No OPENAI_API_KEY secret is configured, so LLM-dependent tests
      # (backend/ingestion/entity_extraction.py) skip themselves -- see
      # their skipif. Neo4j itself needs no secret, so it runs for real:
      # graph_client.py and the master-catalog/synonym seed scripts get
      # real integration coverage here.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/orthopedics-dev
        ports:
          - 7687:7687
    env:
      DATABASE_URL: postgresql://orthopedics:orthopedics-dev@localhost:5432/orthopedics_agents
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: orthopedics-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Wait for Neo4j
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 7687 && exit 0
            sleep 2
          done
          echo "Neo4j did not become ready" && exit 1
      - run: alembic upgrade head
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build

  evals:
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run golden dataset evals
        run: python -m evals.harness --all-workflows --dataset evals/golden_datasets
